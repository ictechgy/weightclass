[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "weightclass"
dynamic = ["version"]
description = "Local, policy-driven routing for agent CLI workflows."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["cli", "codex", "claude", "antigravity", "grok", "router", "task-classification"]
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Utilities",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/ictechgy/weightclass"
Repository = "https://github.com/ictechgy/weightclass"
Issues = "https://github.com/ictechgy/weightclass/issues"

[project.scripts]
wclass = "weightclass.entrypoint:main"
wclass-advisory = "weightclass.advisory.wclass_advisory:main"

[tool.setuptools.packages.find]
where = ["src"]

# Typing :: Typed 를 광고하려면 마커를 실제로 배포해야 한다.
[tool.setuptools.package-data]
weightclass = ["delegation_qualifications.json", "examples/*.json", "py.typed"]
"weightclass.advisory" = [
    "skill/SKILL.md",
    "skill/manifest.json",
    "skill/agents/*.yaml",
    "skill/references/*.md",
]

[tool.setuptools.dynamic]
version = {attr = "weightclass.__version__"}

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# 검증기 재현율 하네스의 체크 스크립트는 사전 등록으로 동결되어 지문이 리포트에
# 묶여 있다. 스타일을 고치면 지문이 바뀌므로 저장소 lint 범위에서 뺀다.
extend-exclude = ["tests/eval/verifier-recall-checks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
strict = true
# ruff 와 같은 이유로 동결된 하네스 체크 스크립트는 제외한다.
exclude = ["tests/eval/verifier-recall-checks/"]
# 테스트도 포함한다. src 만 보면 테스트의 타입 회귀가 CI 에 보이지 않는다.
files = ["src/weightclass", "tests"]
mypy_path = ["src"]
