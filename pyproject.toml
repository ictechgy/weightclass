[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "weightclass"
dynamic = ["version"]
description = "Local, policy-driven routing for Codex and Claude workflows."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["cli", "codex", "claude", "router", "task-classification"]
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Utilities",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/ictechgy/weightclass"
Repository = "https://github.com/ictechgy/weightclass"
Issues = "https://github.com/ictechgy/weightclass/issues"

[project.scripts]
wclass = "weightclass.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# Typing :: Typed 를 광고하려면 마커를 실제로 배포해야 한다.
[tool.setuptools.package-data]
weightclass = ["delegation_qualifications.json", "py.typed"]

[tool.setuptools.dynamic]
version = {attr = "weightclass.__version__"}

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
strict = true
# 테스트도 포함한다. src 만 보면 테스트의 타입 회귀가 CI 에 보이지 않는다.
files = ["src/weightclass", "tests"]
mypy_path = ["src"]
