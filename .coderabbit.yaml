# Keep automated reviews focused on actionable public-repository feedback.
language: "ko-KR"

reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  auto_review:
    enabled: true
    drafts: false
  path_filters:
    - "!**/.env*"
    - "!**/secrets/**"
    - "!**/*.pem"
    - "!**/*.key"

chat:
  auto_reply: true
