name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test runner
        run: python -m pip install . pytest
      - name: Verify installed CLI
        run: |
          output="$(printf '%s' 'Fix a spelling typo in the README heading.' | wclass classify)"
          test "$output" = '{"tier": "low"}'
      - name: Run full source suite with ResourceWarning boundary
        if: matrix.python-version == '3.10' || matrix.python-version == '3.14'
        run: python -W error::ResourceWarning -m pytest -q
      - name: Run full source suite
        if: matrix.python-version != '3.10' && matrix.python-version != '3.14'
        run: python -m pytest -q

  quality:
    name: Lint, types, and package build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 2
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      # 개발 도구만 설치한다. 패키지 자체는 런타임 의존성이 없다.
      - name: Install development tooling
        run: python -m pip install ruff mypy build twine pytest
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Type check
        run: mypy --strict src tests
      - name: Compile source and tests
        run: python -m compileall -q src tests
      - name: Run guarded, documentation, and workflow gates
        run: |
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src python -m pytest -q \
            tests/test_guarded_runtime_suite.py \
            tests/test_ci_workflow_structure.py \
            tests/test_release_workflow_structure.py
      - name: Reject whitespace errors
        run: git diff --check HEAD^1 HEAD
      - name: Build distributions
        run: python -m build
      - name: Verify distribution metadata
        run: twine check --strict dist/*.whl dist/*.tar.gz
      - name: Verify qualification isolation in distributions
        run: |
          python tests/verify_distribution_isolation.py \
            --source . --dist-dir dist \
            --run-sdist-tests

  macos-routing-boundaries:
    name: macOS routing boundaries (Python ${{ matrix.python-version }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify routing, observation, process, and guarded boundaries
        run: |
          PYTHONPATH=src python -W error::ResourceWarning -m unittest \
            tests.test_router tests.test_agent_discovery tests.test_native_v2_runtime \
            tests.test_executable_observation tests.test_foreground_process \
            tests.test_process_context tests.test_triage tests.test_json_input \
            tests.test_cost_recommendation \
            tests.test_guarded_runtime_suite
