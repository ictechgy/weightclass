name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install .
      - name: Verify installed CLI
        run: |
          output="$(printf '%s' 'Fix a spelling typo in the README heading.' | wclass classify)"
          test "$output" = '{"tier": "low"}'
      - name: Run test suite
        run: python -m unittest discover -s tests

  quality:
    name: Lint, types, and package build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      # 개발 도구만 설치한다. 패키지 자체는 런타임 의존성이 없다.
      - name: Install development tooling
        run: python -m pip install ruff mypy build twine
      - name: Lint
        run: ruff check src tests
      - name: Check formatting
        run: ruff format --check src tests
      - name: Type check
        run: mypy
      - name: Build distributions
        run: python -m build
      - name: Verify distribution metadata
        run: twine check --strict dist/*.whl dist/*.tar.gz
      - name: Verify qualification isolation in distributions
        run: |
          python tests/verify_distribution_isolation.py \
            --source . --dist-dir dist \
            --run-sdist-tests

  macos-routing-boundaries:
    name: macOS routing boundaries (Python ${{ matrix.python-version }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify process and JSON input boundaries
        run: |
          PYTHONPATH=src python -W error::ResourceWarning -m unittest \
            tests.test_triage tests.test_json_input \
            tests.test_delegation_conformance tests.test_delegation_runtime
