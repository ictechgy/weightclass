name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build-candidate:
    name: Build immutable Python 3.13 candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.12"
      - name: Verify tag is reachable from reviewed main
        run: >-
          python tests/verify_release_source.py --repository .
          --tag-commit "$GITHUB_SHA" --main-ref refs/remotes/origin/main
      - name: Networked CI dependency installation
        run: >-
          python -m pip install --require-hashes --only-binary=:all: --no-deps
          --requirement requirements/release.txt
      - name: Verify source and tag
        run: |
          test "$(PYTHONPATH=src python -c 'import weightclass; print(weightclass.__version__)')" = "${GITHUB_REF_NAME#v}"
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src python -W error::ResourceWarning -m unittest discover -s tests
          ruff check src tests
          ruff format --check src tests
          mypy
      - name: Build distributions once
        run: python -m build --no-isolation --outdir build-output
      - name: Create and verify canonical manifest candidate
        run: |
          python tests/verify_release_candidate.py \
            --create-manifest-from build-output \
            --artifact-download artifact-download
          python tests/verify_release_candidate.py \
            --artifact-download artifact-download \
            --create-publish-staging dist-under-test \
            --expected-version "${GITHUB_REF_NAME#v}"
          python tests/compare_release_candidates.py \
            --artifact-download artifact-download \
            --reference release-normalized-v1.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate-v1
          path: artifact-download
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-normalized-v1
          path: release-normalized-v1.json
          if-no-files-found: error
      - name: Check immutable candidate metadata
        run: |
          mapfile -t packages < <(python tests/verify_release_candidate.py \
            --artifact-download artifact-download \
            --print-staging-paths dist-under-test)
          test "${#packages[@]}" -eq 2
          python -m twine check --strict "${packages[@]}"

  validate-python-310:
    name: Validate candidate on Python 3.10
    needs: build-candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-v1
          path: artifact-download
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-normalized-v1
          path: reference
      - name: Validate immutable download and descriptor goldens
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src python -W error::ResourceWarning -m unittest discover -s tests
          python tests/verify_release_candidate.py --artifact-download artifact-download --create-staging dist-under-test --expected-version "${GITHUB_REF_NAME#v}"
          python tests/compare_release_candidates.py --artifact-download artifact-download --reference reference/release-normalized-v1.json
          mapfile -t packages < <(python tests/verify_release_candidate.py --artifact-download artifact-download --print-staging-paths dist-under-test)
          test "${#packages[@]}" -eq 2
          case "${packages[0]}:${packages[1]}" in *.whl:*.tar.gz) ;; *) exit 1 ;; esac
          installed_wheel="$RUNNER_TEMP/weightclass-installed-wheel"
          test ! -e "$installed_wheel"
          python -m pip install --no-index --no-deps --target "$installed_wheel" "${packages[0]}"
          installed_venv="$RUNNER_TEMP/weightclass-installed-venv"
          test ! -e "$installed_venv"
          python -m venv "$installed_venv"
          "$installed_venv/bin/python" -m pip install --no-index --no-deps "${packages[0]}"
          test "$("$installed_venv/bin/wclass" --version)" = "weightclass ${GITHUB_REF_NAME#v}"
          "$installed_venv/bin/wclass-advisory" --help >/dev/null
          "$installed_venv/bin/python" -m weightclass.advisory --help >/dev/null
          installed_agent_bin="$RUNNER_TEMP/weightclass-installed-agent-bin"
          mkdir -m 700 "$installed_agent_bin"
          installed_true="$(type -P true)"
          test -x "$installed_true"
          for agent in agy claude codex grok; do
            ln -s "$installed_true" "$installed_agent_bin/$agent"
          done
          export PATH="$installed_agent_bin:$PATH"
          test "$(printf '%s' 'Fix a spelling typo.' | "$installed_venv/bin/wclass" classify)" = '{"tier": "low"}'
          "$installed_venv/bin/wclass" review-cost-profile --help >/dev/null
          "$installed_venv/bin/wclass" recommend --help >/dev/null
          "$installed_venv/bin/wclass" example-policy agy-cost-focused >/dev/null
          "$installed_venv/bin/wclass" example-policy claude-cost-focused >/dev/null
          "$installed_venv/bin/wclass" example-policy codex-cost-focused --model release-smoke-model >/dev/null
          "$installed_venv/bin/wclass" example-policy grok-cost-focused >/dev/null
          "$installed_venv/bin/wclass" review-preset claude-cost-focused --low-model release-smoke-claude-model --low-effort low >/dev/null
          printf '%s' 'Fix a spelling typo.' | "$installed_venv/bin/wclass" route --cost-focused --source-vendor codex --model release-smoke-model --tier standard >/dev/null
          printf '%s' 'Fix a spelling typo.' | "$installed_venv/bin/wclass" route --preset codex-cost-focused --standard-model release-smoke-codex-model --standard-effort medium --tier standard >/dev/null
          printf '%s' 'Fix a spelling typo.' | "$installed_venv/bin/wclass" route --preset grok-cost-focused --standard-model release-smoke-grok-model --tier standard >/dev/null
          PYTHONPATH="$installed_wheel" python -m compileall -q "$installed_wheel/weightclass"
          test "$(PYTHONPATH="$installed_wheel" python -c 'import importlib.metadata; print(importlib.metadata.version("weightclass"))')" = "${GITHUB_REF_NAME#v}"
          test "$(PYTHONPATH="$installed_wheel" python -m weightclass --version)" = "weightclass ${GITHUB_REF_NAME#v}"
          PYTHONPATH="$installed_wheel" python -W error::ResourceWarning -m unittest tests.test_native_v2_compile.NativeV2CompileTests.test_claude_builder_and_golden_fingerprint tests.test_delegation_v2_compile.DelegationV2CompileTests.test_descriptor_matches_canonical_golden
          python tests/verify_release_candidate.py --artifact-download artifact-download --print-staging-paths dist-under-test >/dev/null

  validate-python-314:
    name: Validate candidate on Python 3.14
    needs: build-candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-v1
          path: artifact-download
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-normalized-v1
          path: reference
      - name: Validate immutable download and descriptor goldens
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src python -W error::ResourceWarning -m unittest discover -s tests
          python tests/verify_release_candidate.py --artifact-download artifact-download --create-staging dist-under-test --expected-version "${GITHUB_REF_NAME#v}"
          python tests/compare_release_candidates.py --artifact-download artifact-download --reference reference/release-normalized-v1.json
          mapfile -t packages < <(python tests/verify_release_candidate.py --artifact-download artifact-download --print-staging-paths dist-under-test)
          test "${#packages[@]}" -eq 2
          case "${packages[0]}:${packages[1]}" in *.whl:*.tar.gz) ;; *) exit 1 ;; esac
          installed_wheel="$RUNNER_TEMP/weightclass-installed-wheel"
          test ! -e "$installed_wheel"
          python -m pip install --no-index --no-deps --target "$installed_wheel" "${packages[0]}"
          installed_venv="$RUNNER_TEMP/weightclass-installed-venv"
          test ! -e "$installed_venv"
          python -m venv "$installed_venv"
          "$installed_venv/bin/python" -m pip install --no-index --no-deps "${packages[0]}"
          test "$("$installed_venv/bin/wclass" --version)" = "weightclass ${GITHUB_REF_NAME#v}"
          "$installed_venv/bin/wclass-advisory" --help >/dev/null
          "$installed_venv/bin/python" -m weightclass.advisory --help >/dev/null
          installed_agent_bin="$RUNNER_TEMP/weightclass-installed-agent-bin"
          mkdir -m 700 "$installed_agent_bin"
          installed_true="$(type -P true)"
          test -x "$installed_true"
          for agent in agy claude codex grok; do
            ln -s "$installed_true" "$installed_agent_bin/$agent"
          done
          export PATH="$installed_agent_bin:$PATH"
          test "$(printf '%s' 'Fix a spelling typo.' | "$installed_venv/bin/wclass" classify)" = '{"tier": "low"}'
          "$installed_venv/bin/wclass" review-cost-profile --help >/dev/null
          "$installed_venv/bin/wclass" recommend --help >/dev/null
          "$installed_venv/bin/wclass" example-policy agy-cost-focused >/dev/null
          "$installed_venv/bin/wclass" example-policy claude-cost-focused >/dev/null
          "$installed_venv/bin/wclass" example-policy codex-cost-focused --model release-smoke-model >/dev/null
          "$installed_venv/bin/wclass" example-policy grok-cost-focused >/dev/null
          "$installed_venv/bin/wclass" review-preset claude-cost-focused --low-model release-smoke-claude-model --low-effort low >/dev/null
          printf '%s' 'Fix a spelling typo.' | "$installed_venv/bin/wclass" route --cost-focused --source-vendor codex --model release-smoke-model --tier standard >/dev/null
          printf '%s' 'Fix a spelling typo.' | "$installed_venv/bin/wclass" route --preset codex-cost-focused --standard-model release-smoke-codex-model --standard-effort medium --tier standard >/dev/null
          printf '%s' 'Fix a spelling typo.' | "$installed_venv/bin/wclass" route --preset grok-cost-focused --standard-model release-smoke-grok-model --tier standard >/dev/null
          PYTHONPATH="$installed_wheel" python -m compileall -q "$installed_wheel/weightclass"
          test "$(PYTHONPATH="$installed_wheel" python -c 'import importlib.metadata; print(importlib.metadata.version("weightclass"))')" = "${GITHUB_REF_NAME#v}"
          test "$(PYTHONPATH="$installed_wheel" python -m weightclass --version)" = "weightclass ${GITHUB_REF_NAME#v}"
          PYTHONPATH="$installed_wheel" python -W error::ResourceWarning -m unittest tests.test_native_v2_compile.NativeV2CompileTests.test_claude_builder_and_golden_fingerprint tests.test_delegation_v2_compile.DelegationV2CompileTests.test_descriptor_matches_canonical_golden
          python tests/verify_release_candidate.py --artifact-download artifact-download --print-staging-paths dist-under-test >/dev/null

  macos-routing-boundaries:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify routing, observation, process, guarded, and conformance boundaries
        run: |
          PYTHONPATH=src python -W error::ResourceWarning -m unittest \
            tests.test_router tests.test_agent_discovery tests.test_native_v2_runtime \
            tests.test_executable_observation tests.test_foreground_process \
            tests.test_process_context tests.test_triage tests.test_json_input \
            tests.test_cost_recommendation \
            tests.test_delegation_runtime tests.test_delegation_v2_runtime \
            tests.test_guarded_runtime_suite tests.test_delegation_conformance

  publish:
    name: Publish exact reviewed candidate
    needs: [validate-python-310, validate-python-314, macos-routing-boundaries]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/weightclass/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate-v1
          path: artifact-download
      - name: Create exact manifest-named publish staging
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python tests/verify_release_candidate.py --artifact-download artifact-download --create-publish-staging publish-staging --expected-version "${GITHUB_REF_NAME#v}"
          mapfile -t packages < <(python tests/verify_release_candidate.py --artifact-download artifact-download --print-staging-paths publish-staging)
          test "${#packages[@]}" -eq 2
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: publish-staging
