name: Release

# 태그를 밀면 배포한다. 태그 푸시는 사람이 하는 명시적 행위이므로 그것이
# 배포 승인 지점이다. 자격증명은 저장하지 않는다. PyPI Trusted Publishing 이
# OIDC 로 이 워크플로를 직접 신뢰하므로 리포지토리에 토큰이 없다.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    name: Verify the tagged commit
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      # 태그와 패키지 버전이 어긋난 채 배포되면 되돌릴 수 없다. PyPI 는 같은
      # 버전 번호를 다시 올릴 수 없기 때문이다. 배포 전에 먼저 막는다.
      - name: Require the tag to match the package version
        run: |
          declared="$(PYTHONPATH=src python -c 'import weightclass; print(weightclass.__version__)')"
          tagged="${GITHUB_REF_NAME#v}"
          echo "declared=${declared} tagged=${tagged}"
          test "${declared}" = "${tagged}"
      - name: Install package
        run: python -m pip install .
      - name: Verify installed CLI
        run: |
          expected="$(PYTHONPATH=src python -c 'import weightclass; print(weightclass.__version__)')"
          installed="$(wclass --version)"
          test "$installed" = "weightclass $expected"
          metadata="$(python -c 'import importlib.metadata; print(importlib.metadata.version("weightclass"))')"
          test "$metadata" = "$expected"
          output="$(printf '%s' 'Fix a spelling typo in the README heading.' | wclass classify)"
          test "$output" = '{"tier": "low"}'
      - name: Run test suite
        run: python -m unittest discover -s tests
      - name: Install development tooling
        run: python -m pip install ruff mypy build twine
      - name: Lint
        run: ruff check src tests
      - name: Check formatting
        run: ruff format --check src tests
      - name: Type check
        run: mypy
      - name: Build distributions
        run: python -m build
      - name: Verify distribution metadata
        run: twine check --strict dist/*
      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/

  macos-routing-boundaries:
    name: Verify macOS routing boundaries
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify process and JSON input boundaries
        run: |
          PYTHONPATH=src python -W error::ResourceWarning -m unittest \
            tests.test_triage tests.test_json_input

  publish:
    name: Publish to PyPI
    needs: [verify, macos-routing-boundaries]
    runs-on: ubuntu-latest
    # 이 environment 에 required reviewer 를 걸면 배포 직전에 한 번 더 사람이
    # 승인해야 한다. PyPI Trusted Publisher 등록 시에도 같은 이름을 쓴다.
    environment:
      name: pypi
      url: https://pypi.org/project/weightclass/
    permissions:
      # Trusted Publishing 이 요구하는 유일한 권한. API 토큰을 쓰지 않는다.
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
